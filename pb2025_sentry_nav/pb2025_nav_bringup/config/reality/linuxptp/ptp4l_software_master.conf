[global]
# Software timestamping is required on this host because eno1 has no PHC.
time_stamping           software
network_transport       UDPv4
delay_mechanism         E2E
twoStepFlag             1

# Force the host to act as the master on the lidar subnet.
BMCA                    noop
masterOnly              1
priority1               10
priority2               10
domainNumber            0

# Weighting helps more when timestamps come from the software networking stack.
tsproc_mode             filter_weight

# Faster sync than defaults, but still conservative for a switch-only lidar subnet.
logAnnounceInterval     0
logSyncInterval         -3
logMinDelayReqInterval  -3
announceReceiptTimeout  3
tx_timestamp_timeout    100

# Keep output on stdout instead of syslog so it is easy to debug in a terminal.
summary_interval        0
verbose                 1
use_syslog              0
uds_address             /var/run/ptp4l-livox
